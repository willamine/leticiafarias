<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel administrativo do sistema de anamnese." />
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/painel.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Voltar para a página inicial">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>Administração</span>
        </a>

        <div class="toolbar">
          <div class="user-meta" id="userMeta">
            <span class="user-pill" id="userInitial">A</span>
            <span id="userLabel">Carregando...</span>
          </div>
          <button id="logoutButton" class="secondary-button" type="button">Sair</button>
        </div>
      </div>
    </header>

    <main class="container panel-page">
      <div class="panel-layout">
        <aside class="sidebar-panel">
          <div class="section-header">
            <h2>Alunos</h2>
          </div>

          <div class="form-field search-box">
            <label for="searchInput" class="visually-hidden">Pesquisar aluno</label>
            <input id="searchInput" type="search" placeholder="Pesquisar por nome" />
          </div>

          <ul id="studentList" class="student-list" aria-live="polite"></ul>
        </aside>

        <section class="content-panel" aria-live="polite">
          <div id="detailContent">
            <div class="empty-state">Selecione um aluno para visualizar os dados.</div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="assets/js/config.js"></script>
    <script type="module" src="assets/js/painel.js"></script>
  </body>
</html>
